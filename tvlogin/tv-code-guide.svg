<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Example TV sign-in screen with Use Phone selected</title><desc id="desc">A monochrome illustration showing Use Phone selected, Use Remote unselected, and a sample TV code 1234-5678.</desc><defs><linearGradient id="screen" x2="0" y2="1"><stop stop-color="#222"/><stop offset="1" stop-color="#080808"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="#eee"/><rect x="35" y="32" width="1130" height="570" rx="15" fill="#111" stroke="#333" stroke-width="8"/><rect x="53" y="50" width="1094" height="534" rx="4" fill="url(#screen)"/><text x="600" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle">CHOOSE HOW TO SIGN IN</text><rect x="315" y="165" width="260" height="68" rx="34" fill="#fff" stroke="#fff" stroke-width="5"/><rect x="322" y="172" width="246" height="54" rx="27" fill="none" stroke="#111" stroke-width="3"/><text x="445" y="209" fill="#111" font-family="Arial,sans-serif" font-size="28" font-weight="800" text-anchor="middle">USE PHONE</text><rect x="592" y="165" width="260" height="68" rx="34" fill="#aaa"/><text x="722" y="208" fill="#222" font-family="Arial,sans-serif" font-size="27" text-anchor="middle">USE REMOTE</text><text x="130" y="300" fill="#fff" font-family="Arial,sans-serif" font-size="25">Enter the code below on your</text><text x="130" y="334" fill="#fff" font-family="Arial,sans-serif" font-size="25">phone or computer.</text><rect x="130" y="365" width="260" height="150" rx="8" fill="#fff"/><g fill="#111"><path d="M150 385h60v60h-60zm12 12v36h36v-36zM310 385h60v60h-60zm12 12v36h36v-36zM150 465h60v36h-60zm12 10v16h36v-16z"/><path d="M230 385h18v18h-18zm28 0h18v30h-18zm-28 28h18v18h-18zm28 20h18v18h-18zm28-20h18v18h-18zm-56 30h18v18h-18zm28 20h18v18h-18zm28 18h18v18h-18zm-28-58h18v18h-18zm56 0h18v18h-18zm-28 28h18v18h-18zm28 28h18v18h-18z"/></g><path d="M435 270v270" stroke="#555" stroke-width="2"/><text x="485" y="310" fill="#bbb" font-family="Arial,sans-serif" font-size="24" font-weight="700">YOUR TV CODE</text><rect x="480" y="330" width="560" height="125" rx="12" fill="#111" stroke="#aaa" stroke-width="3"/><text x="760" y="412" fill="#fff" font-family="Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="8" text-anchor="middle">1234-5678</text><text x="600" y="645" fill="#333" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">ILLUSTRATIVE EXAMPLE — YOUR CODE WILL BE DIFFERENT</text></svg>